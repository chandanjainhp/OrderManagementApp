version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: order_management_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ordermanagement
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: order_management_backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/ordermanagement
      PORT: 5000
      EMAIL_USER: ${EMAIL_USER:-tms00002025@gmail.com}
      EMAIL_PASS: ${EMAIL_PASS:-lvpl scxy rdch kaqr}
    depends_on:
      - postgres
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: order_management_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
